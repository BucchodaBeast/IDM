# Render Blueprint: API (FastAPI) + web (Next.js).
services:
  - type: web
    name: idm-api
    runtime: python
    region: frankfurt
    plan: starter            # do not use free tier in production (cold starts)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: idm-web
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NEXT_PUBLIC_API_URL      # set to the idm-api URL; needed at build time
        sync: false
